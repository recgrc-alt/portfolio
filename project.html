  <!-- Content-Security-Policy: a rede de seguranca. Mesmo que um dia
       entre por engano markup vindo de fora, o browser recusa-se a
       executar seja o que for que nao esteja listado aqui.

       blob: nao e decorativo. O GLTFLoader extrai as texturas de dentro
       do eye.glb e serve-as como URLs blob:; sem isso o olho carrega sem
       iris. Foi apanhado a testar esta politica, nao em producao. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com 'sha256-4ODAao+sk3HqfLrhlo1/4J/pP6Iybrzy9N3XLy4mCSg='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' blob: https://api-bdc.net https://formspree.io; frame-src https://modular-city.onrender.com; form-action https://formspree.io; base-uri 'self'; object-src 'none'" />

  <!-- Favicon. Three sizes because browsers ask for different ones and none of
       them negotiate: 16/32 for the tab, 180 for an iOS home screen. The PNGs
       rather than the 1000px WebP source, which Safari will not accept in this
       role and which every other browser would have to download whole just to
       draw sixteen pixels. favicon.ico sits at the site root as well, because
       some clients request /favicon.ico without ever reading the markup. -->
  <link rel="icon" href="assets/favicon-32.png?v=70" sizes="32x32" type="image/png" />
  <link rel="icon" href="assets/favicon-16.png?v=70" sizes="16x16" type="image/png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=70" />

  <!-- Fonts: Space Grotesk (display) + Inter (body + italic name). -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,700;1,400;1,700&family=Space+Grotesk:wght@400;500;700&display=swap"
    rel="stylesheet" />

  <!-- Tokens first, then the shared stylesheet, then the page layouts. -->
  <link rel="stylesheet" href="css/tokens.css?v=70" />
  <link rel="stylesheet" href="css/style.css?v=70" />
  <link rel="stylesheet" href="css/pages.css?v=70" />

  <!-- Three.js + Lenis (smooth scroll) via import map — no build step.
       This MUST come before any module load or preload (see below). -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "lenis": "https://unpkg.com/lenis@1.1.14/dist/lenis.mjs"
      }
    }
  </script>

  <!-- ONLY NOW may a module be fetched. These are hints, not imports, but a
       modulepreload counts as "module loading has begun" — and an import map
       that arrives after that point is rejected outright. Firefox enforces
       this strictly: with the preload above the map, every bare "three"
       specifier failed to resolve and the whole bundle died. Keep them here. -->
  <link rel="preconnect" href="https://unpkg.com" crossorigin />
  <link rel="modulepreload" href="https://unpkg.com/three@0.160.0/build/three.module.js" crossorigin />

  <!-- This page is a template: it is not indexed on its own, because every
       URL is the same file with a different ?id=. -->
  <meta name="robots" content="noindex" />
</head>

<body class="page page--project">

  <!-- ====================================================================
       LOADER  ·  shown once per visit, while the site arrives
       In the markup rather than built by script, so it is on screen from the
       first paint — a loading screen that waits for JavaScript has missed the
       moment it exists for. loader.js only takes it away again.
       ==================================================================== -->
  <div class="loader" data-loader aria-hidden="true">
    <video class="loader__eye" data-loader-eye autoplay muted loop playsinline
           width="200" height="200">
      <source src="assets/loading-eye.webm" type="video/webm" />
    </video>
    <p class="loader__dots"><span></span><span></span><span></span></p>
  </div>


  <!-- The black wipe between pages. Its fade-IN is a pure CSS animation so it
       clears itself even if JS never runs; page-transition.js only drives the
       fade-OUT on the way to the next page. -->
  <div class="page-veil" data-page-veil aria-hidden="true"></div>

  <!-- ====================================================================
       FIXED BACKGROUND EYE
       Stays put across all scroll, on every page. Decorative → aria-hidden.
       ==================================================================== -->
  <canvas class="eye-layer" id="eye-canvas" aria-hidden="true"></canvas>

  <!-- Veil over the eye: on interior pages it is background, not subject. -->
  <div class="eye-scrim" aria-hidden="true"></div>

          <button class="lang__btn text-echo is-active" type="button" data-lang="en" data-text="ENG" aria-pressed="true">ENG</button>
        </div>

        <!-- Mutes the whole site: ambience, click ticks, a reel's own sound.
             Both glyphs ship here and CSS picks one from aria-pressed — the

          </svg>
        </button>
      </div>
    </nav>
  </header>

  <!-- ====================================================================
       HUD  (fixed, persistent — local time never disappears)
       ==================================================================== -->
  <div class="hud">
    <!-- The time gets a wrapper of its own because the hour picker is
         positioned against it, and a <p> cannot legally contain the panel's
         markup. This div is the positioning context; see .hud__slot. -->
    <div class="hud__slot">
    <p class="meta meta--time">
      <span class="meta__label" data-i18n="hud.time">Local time:</span>
      <span class="meta__value" data-clock>[ --&nbsp;:&nbsp;--&nbsp;:&nbsp;-- ]</span>
